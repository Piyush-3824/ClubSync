<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClubSync — Explore Clubs</title>
  <meta name="description" content="Explore and discover clubs at your college. Filter by category, search by name, and find your community on ClubSync.">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/explore.css">
</head>
<body>

  <!-- Ambient Background -->
  <div class="ambient-bg">
    <div class="ambient-blob ambient-blob-1"></div>
    <div class="ambient-blob ambient-blob-2"></div>
    <div class="ambient-blob ambient-blob-3"></div>
  </div>

  <!-- ═══════════════════════════════════════
       APP LAYOUT
  ════════════════════════════════════════ -->
  <div class="app-layout">
    
    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="navbar-brand">
          <div class="brand-logo">CS</div>
          <span class="brand-name">ClubSync</span>
        </a>
      </div>

        <a href="../index.html" class="sidebar-link"><span class="sidebar-link-icon">🏠</span> Home</a>
        <a href="#" class="sidebar-link active"><span class="sidebar-link-icon">🧭</span> Explore Clubs</a>
        <a href="#" class="sidebar-link" onclick="alert('My Applications coming soon!')"><span class="sidebar-link-icon">📋</span> My Applications</a>
        <a href="#" class="sidebar-link" onclick="alert('Events coming soon!')"><span class="sidebar-link-icon">📅</span> Events</a>
        <a href="#" class="sidebar-link" onclick="alert('Saved Clubs coming soon!')"><span class="sidebar-link-icon">🔖</span> Saved</a>
        <a href="#" class="sidebar-link" onclick="alert('Messages coming soon!')"><span class="sidebar-link-icon">💬</span> Messages</a>
        <a href="#" class="sidebar-link" onclick="alert('Notifications coming soon!')"><span class="sidebar-link-icon">🔔</span> Notifications</a>
        <a href="#" class="sidebar-link" onclick="alert('Settings coming soon!')"><span class="sidebar-link-icon">⚙️</span> Settings</a>

      <div class="sidebar-footer">
        <div class="user-profile-card">
          <div class="avatar" style="background: var(--green-subtle);">A</div>
          <div class="user-info">
            <span class="user-name">Aarav Sharma</span>
            <span class="user-role">View Profile</span>
          </div>
          <span class="sidebar-link-icon" style="font-size: 0.8rem;">▼</span>
        </div>
      </div>
    </aside>

    <!-- ── Main Content ── -->
    <main class="main-content">
      
      <!-- ── Hero Section ── -->
      <section class="explore-hero">
        <div class="hero-text-content">
          <h1 class="hero-huge-title">
            Explore.<br>
            Connect.<br>
            <span class="highlight-green">Belong.</span>
          </h1>
          <p class="hero-sub">Discover clubs that match your passions and goals.</p>
        </div>
        <div class="hero-image-container">
          <!-- The generated image -->
          <img src="../assets/explore_hero.png" alt="3D Planet" class="hero-planet-img">
        </div>
      </section>

      <div class="container" style="max-width: 1400px; padding: 0 2.5rem;">
        <!-- ── Search & Filter Bar ── -->
        <div class="search-filter-bar">
          <div class="input-wrapper" style="flex:1;">
            <span class="input-icon">🔍</span>
            <input type="search" class="input-field" id="search-input"
              placeholder="Search clubs, categories, or keywords..."
              style="padding-left: 2.5rem; height: 100%;">
          </div>
          <button class="btn btn-primary" style="padding: 0.75rem 1.25rem;" onclick="document.getElementById('search-input').focus()">
            🔍
          </button>
        </div>
        <div class="filter-chips" style="margin-bottom: 2rem;">
          <button class="filter-chip active" id="filter-all" onclick="filterCategory('all', this)">All</button>
          <button class="filter-chip" onclick="filterCategory('technical', this)">Tech</button>
          <button class="filter-chip" onclick="filterCategory('arts', this)">Arts</button>
          <button class="filter-chip" onclick="filterCategory('sports', this)">Sports</button>
          <button class="filter-chip" onclick="filterCategory('academic', this)">Academic</button>
          <button class="filter-chip" onclick="filterCategory('cultural', this)">Cultural</button>
          <button class="filter-chip" onclick="filterCategory('entrepreneurship', this)">Entrepreneurship</button>
          <button class="filter-chip" onclick="filterCategory('social_impact', this)">Social Impact</button>
          <button class="filter-chip" onclick="filterCategory('music', this)">Music</button>
          <button class="filter-chip" style="margin-left: auto; border: 1px solid var(--border-dim);" onclick="openDrawer()"><span class="sidebar-link-icon" style="font-size: 0.9rem; margin-right: 4px;">⚙️</span> More Filters</button>
        </div>
        <!-- ── Featured Clubs ── -->
        <div class="section-heading-row">
          <h2 class="section-title"><span class="title-accent">|</span> Featured Clubs</h2>
          <a href="#" class="view-all-link" onclick="event.preventDefault(); window.scrollTo({top: document.getElementById('clubs-grid').offsetTop - 100, behavior: 'smooth'})">View All <span class="nav-arrows">〈 〉</span></a>
        </div>
        <div class="featured-clubs-grid" id="featured-clubs-grid">
          <!-- Featured clubs injected here via JS -->
        </div>

        <!-- ── Sort + Results Count ── -->
        <div class="results-bar" style="margin-top: 3rem;">
          <h2 class="section-title">All Clubs</h2>
          <div class="sort-wrapper">
            <label class="sort-label" for="sort-select">Sort by:</label>
            <select class="sort-select" id="sort-select" onchange="sortClubs(this.value)">
              <option value="newest">Newest</option>
              <option value="popular">Most Popular</option>
              <option value="alphabetical">A–Z</option>
              <option value="members">Most Members</option>
              <option value="recruiting">Recruiting Now</option>
            </select>
            <div class="view-toggle" style="margin-left: 1rem;">
              <button class="view-btn active" id="view-grid-btn" onclick="setView('grid')">⊞</button>
              <button class="view-btn" id="view-list-btn" onclick="setView('list')">☰</button>
            </div>
          </div>
        </div>

        <!-- ── Club Cards Grid ── -->
        <div class="clubs-grid dense-grid" id="clubs-grid"></div>

        <!-- ── Pagination ── -->
        <div class="pagination" id="pagination">
          <button class="page-btn" id="prev-btn" onclick="changePage(-1)">←</button>
          <div class="page-numbers" id="page-numbers"></div>
          <button class="page-btn" id="next-btn" onclick="changePage(1)">→</button>
        </div>
      </div>
    </main>
  </div>

  <!-- ── Side Drawer / Filters ── -->
  <div class="drawer-overlay" id="drawer-overlay" onclick="closeDrawer()"></div>
  <div class="filter-drawer" id="filter-drawer">
    <div class="drawer-header">
      <h3 class="drawer-title">Advanced Filters</h3>
      <button class="drawer-close" onclick="closeDrawer()">×</button>
    </div>
    
    <div class="drawer-content">
      <!-- Meeting Times -->
      <div class="filter-group">
        <label class="filter-label">Meeting Times</label>
        <div class="checkbox-list">
          <label class="checkbox-label"><input type="checkbox" name="meeting-time" value="Morning" onchange="updateAdvancedFilters()"> Morning</label>
          <label class="checkbox-label"><input type="checkbox" name="meeting-time" value="Afternoon" onchange="updateAdvancedFilters()"> Afternoon</label>
          <label class="checkbox-label"><input type="checkbox" name="meeting-time" value="Evening" onchange="updateAdvancedFilters()"> Evening</label>
          <label class="checkbox-label"><input type="checkbox" name="meeting-time" value="Weekends" onchange="updateAdvancedFilters()"> Weekends</label>
        </div>
      </div>

      <!-- Active Status -->
      <div class="filter-group">
        <label class="filter-label">Active Status</label>
        <div class="radio-list">
          <label class="radio-label"><input type="radio" name="status" value="All" checked onchange="updateAdvancedFilters()"> All</label>
          <label class="radio-label"><input type="radio" name="status" value="Active" onchange="updateAdvancedFilters()"> Highly Active</label>
          <label class="radio-label"><input type="radio" name="status" value="Inactive" onchange="updateAdvancedFilters()"> Moderate / Inactive</label>
        </div>
      </div>

      <!-- Member Spots -->
      <div class="filter-group">
        <label class="filter-label">Availability</label>
        <label class="checkbox-label">
          <input type="checkbox" id="filter-open-spots" onchange="updateAdvancedFilters()"> 
          Has Open Member Spots
        </label>
      </div>
    </div>
    
    <div class="drawer-footer">
      <button class="btn btn-ghost" onclick="clearAdvancedFilters()" style="flex: 1;">Clear All</button>
      <button class="btn btn-primary" onclick="closeDrawer()" style="flex: 1;">Apply Filters</button>
    </div>
  </div>

  <script src="../js/clubs.js"></script>
  <script src="../js/explore.js"></script>
</body>
</html>
